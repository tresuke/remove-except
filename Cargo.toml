[package]
name = "remove-except"
version = "0.2.3"
edition = "2024"
description = "A Rust CLI to keep selected paths or glob matches and remove everything else under a root."
repository = "https://github.com/tresuke/remove-except"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
dialoguer = "0.12"
globset = "0.4"
walkdir = "2"

[target.'cfg(windows)'.dependencies]
regex-automata = "0.4"
unicode-casefold = "0.2"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"

[[bench]]
name = "plan_generation"
harness = false