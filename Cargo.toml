[package]
name = "remove-except"
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
description = "A Rust CLI to keep selected paths or glob matches and remove everything else under a root."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tresuke/remove-except"
documentation = "https://docs.rs/remove-except"
keywords = ["cli", "filesystem", "cleanup", "glob", "deletion"]
categories = ["command-line-utilities", "filesystem"]
include = [
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/README.ja.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
    "/src/**",
    "/benches/plan_generation.rs",
]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--generate-link-to-definition"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
console = "0.16"
globset = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
unicode-segmentation = "1.13.3"

[target.'cfg(windows)'.dependencies]
regex-automata = "0.4"
unicode-casefold = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
assert_fs = "1"

[[bench]]
name = "plan_generation"
harness = false
