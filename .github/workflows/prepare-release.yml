name: Prepare Release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
      version: ${{ steps.validate.outputs.version }}
      commit: ${{ steps.validate.outputs.commit }}
    steps:
      - name: Validate dispatch tag format
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "This workflow must be dispatched from a Git tag (received ref_type: ${{ github.ref_type }})." >&2
            exit 1
          fi

          RELEASE_TAG="${GITHUB_REF_NAME}"
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Run this workflow from a stable version tag such as v0.3.0." >&2
            exit 1
          fi

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Validate tag and package version
        id: validate
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main --no-tags
          RELEASE_TAG="${GITHUB_REF_NAME}"
          tag_commit="$(git rev-parse "${RELEASE_TAG}^{commit}")"
          if ! git merge-base --is-ancestor "$tag_commit" origin/main; then
            echo "The release tag must point to a commit on main." >&2
            exit 1
          fi

          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "remove-except") | .version')"
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            echo "Tag $RELEASE_TAG does not match Cargo package version $version." >&2
            exit 1
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$tag_commit" >> "$GITHUB_OUTPUT"
          echo "Validated $RELEASE_TAG at $tag_commit."

  build-windows:
    name: Build (x86_64-pc-windows-msvc)
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.88.0
          target: x86_64-pc-windows-msvc

      - name: Install cargo-auditable
        run: cargo install --locked --version 0.7.7 cargo-auditable

      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit

      - name: Audit dependencies
        run: cargo audit --file Cargo.lock

      - name: Run tests
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build release binary
        run: cargo auditable build --locked --release --target x86_64-pc-windows-msvc --bin remove-except

      - name: Verify binary and package
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $target = "x86_64-pc-windows-msvc"
          $binary = "target\$target\release\remove-except.exe"
          $versionOutput = (& $binary --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $versionOutput -ne "remove-except $env:VERSION") {
            throw "Unexpected binary version output: $versionOutput"
          }

          cargo audit bin $binary
          if ($LASTEXITCODE -ne 0) {
            throw "The release binary failed its vulnerability audit."
          }

          $packageName = "remove-except-$env:RELEASE_TAG-$target"
          $stage = Join-Path "dist" $packageName
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item $binary (Join-Path $stage "remove-except.exe")
          Copy-Item README.md, README.ja.md, LICENSE-MIT, LICENSE-APACHE $stage

          $archive = "$packageName.zip"
          Compress-Archive -Path $stage -DestinationPath $archive -CompressionLevel Optimal
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $archive" | Set-Content "$archive.sha256" -Encoding ascii

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: remove-except-${{ needs.validate.outputs.tag }}-x86_64-pc-windows-msvc.zip

      - name: Upload packaged binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-x86_64-pc-windows-msvc
          path: |
            *.zip
            *.zip.sha256
          if-no-files-found: error
          retention-days: 3

  build-linux:
    name: Build (x86_64-unknown-linux-gnu, glibc 2.35+)
    needs: validate
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Install build prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install --yes ca-certificates curl git build-essential

      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.commit }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.88.0
          target: x86_64-unknown-linux-gnu

      - name: Install cargo-auditable
        run: cargo install --locked --version 0.7.7 cargo-auditable

      - name: Install cargo-audit
        run: cargo install --locked --version 0.22.2 cargo-audit

      - name: Audit dependencies
        run: cargo audit --file Cargo.lock

      - name: Run tests
        run: cargo test --locked --target x86_64-unknown-linux-gnu

      - name: Build release binary
        run: cargo auditable build --locked --release --target x86_64-unknown-linux-gnu --bin remove-except

      - name: Verify binary and package
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          target="x86_64-unknown-linux-gnu"
          binary="target/$target/release/remove-except"
          version_output="$("$binary" --version)"
          if [[ "$version_output" != "remove-except $VERSION" ]]; then
            echo "Unexpected binary version output: $version_output" >&2
            exit 1
          fi

          cargo audit bin "$binary"

          package_name="remove-except-$RELEASE_TAG-$target"
          stage="dist/$package_name"
          mkdir -p "$stage"
          cp "$binary" "$stage/remove-except"
          cp README.md README.ja.md LICENSE-MIT LICENSE-APACHE "$stage/"

          archive="$package_name.tar.gz"
          tar -czf "$archive" -C dist "$package_name"
          sha256sum "$archive" > "$archive.sha256"

      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: remove-except-${{ needs.validate.outputs.tag }}-x86_64-unknown-linux-gnu.tar.gz

      - name: Upload packaged binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-x86_64-unknown-linux-gnu
          path: |
            *.tar.gz
            *.tar.gz.sha256
          if-no-files-found: error
          retention-days: 3

  draft-release:
    name: Create draft release
    needs:
      - validate
      - build-windows
      - build-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Create draft release or update existing draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          if release_json="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft 2>release-error.txt)"; then
            if [[ "$(jq -r '.isDraft' <<< "$release_json")" != "true" ]]; then
              echo "A published release already exists for $RELEASE_TAG; refusing to modify it." >&2
              exit 1
            fi
            rm -f release-error.txt
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$RELEASE_TAG" --title "remove-except v$VERSION" --repo "$GITHUB_REPOSITORY"
          else
            if ! grep -qi "not found" release-error.txt; then
              cat release-error.txt >&2
              exit 1
            fi
            rm -f release-error.txt
            gh release create "$RELEASE_TAG" release-assets/* \
              --draft \
              --verify-tag \
              --title "remove-except v$VERSION" \
              --generate-notes \
              --repo "$GITHUB_REPOSITORY"
          fi
